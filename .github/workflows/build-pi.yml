name: Build & Publish Hitokage Pi Image

on:
  push:
    branches:
      - main
    paths:
      # Only rebuild when app code, dependencies, or Docker config changes
      - 'backend/**'
      - 'lib/**'
      - 'frontend/**'
      - 'config.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.pi.yml'
      - '.github/workflows/build-pi.yml'
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo-name" — becomes ghcr.io/owner/repo-name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build ARM64 image and push to ghcr.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU lets the x86 runner emulate ARM64 for the build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Buildx is required for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags:
      #   latest          → every push to main
      #   sha-<short>     → every push (immutable, useful for rollbacks)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Generate build timestamp
        id: ts
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REQUIREMENTS=requirements.txt
            INSTALL_GPIO_LIBS=1
            BUILD_VERSION=2.0.0-${{ steps.meta.outputs.version }}-${{ steps.ts.outputs.value }}
          # Cache layers in the GitHub Actions cache to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
