# docker-compose.deploy.yml — Pi production deployment
#
# Pulls the pre-built ARM64 image from GitHub Container Registry (ghcr.io)
# instead of building locally. Watchtower watches for new image pushes and
# automatically pulls + restarts the kiln container.
#
# FIRST-TIME SETUP on the Pi:
#   1. Log in to ghcr.io (one time):
#        echo <YOUR_GITHUB_PAT> | docker login ghcr.io -u <YOUR_GITHUB_USERNAME> --password-stdin
#      (PAT needs read:packages scope — https://github.com/settings/tokens)
#
#   2. Set your image name in an .env file next to this file:
#        echo "IMAGE=ghcr.io/your-github-username/hitokage-kiln-controller:latest" > .env
#
#   3. Start:
#        docker compose -f docker-compose.deploy.yml up -d
#
# UPDATES:
#   Watchtower checks ghcr.io every 5 minutes and auto-restarts the kiln
#   container when a new image is available. No manual steps needed after
#   pushing to main.
#
# MANUAL UPDATE (if you want to force a pull now):
#   docker compose -f docker-compose.deploy.yml pull && \
#   docker compose -f docker-compose.deploy.yml up -d

services:
  kiln:
    image: ${IMAGE:-ghcr.io/bryanpyle/hitokage-kiln-controller:latest}
    container_name: hitokage-kiln
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      - KILN_SIMULATE=false
      - KILN_STATE_DIR=/app/state-data

    # Raw RPi.GPIO bit-bang SPI needs access to /dev/gpiomem.
    # privileged: true is the most reliable approach across Pi OS versions.
    privileged: true

    # Alternative — use numeric gpio GID without full privilege:
    # devices:
    #   - /dev/gpiomem:/dev/gpiomem
    # group_add:
    #   - "986"  # find with: getent group gpio | cut -d: -f3

    volumes:
      - kiln-profiles:/app/storage/profiles
      - kiln-state:/app/state-data
      # To override config without rebuilding:
      # - ./config.py:/app/config.py:ro
volumes:
  kiln-profiles:
  kiln-state:
